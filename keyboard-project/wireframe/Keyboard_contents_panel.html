<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Content Panel</title>
<style>
  /* ---------- 리셋 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #f4f4f4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ---------- 디바이스 프레임 ---------- */
  .device {
    width: 375px;
    height: 812px;
    background: #ffffff;
    border: 1px solid #d4d4d4;
    border-radius: 4px;
    -webkit-border-radius: 4px;
    overflow: hidden;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    position: relative;
  }

  /* ---------- 상태바 (design.md 토큰) ---------- */
  .status-bar {
    height: 28px;
    padding: 0 18px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: space-between;
    -webkit-justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
  }
  .status-left { 
    display: flex; 
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 6px; 
  }
  .status-right { 
    display: flex; 
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 4px; 
    font-size: 11px; 
  }
  .battery {
    display: inline-flex;
    -webkit-display: inline-flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 3px;
  }
  .battery-icon {
    width: 22px;
    height: 11px;
    border: 1px solid #1a1a1a;
    border-radius: 2px;
    position: relative;
    padding: 1px;
  }
  .battery-icon::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 3px;
    width: 2px;
    height: 3px;
    background: #1a1a1a;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    height: 100%;
    width: 100%;
    background: #1a1a1a;
    border-radius: 1px;
  }
  .signal { font-size: 10px; letter-spacing: -1px; }

  /* ---------- 입력 영역 ---------- */
  .input-area {
    flex: 1;
    -webkit-flex: 1;
    background: #ffffff;
  }

  /* ---------- 배너 (design.md) ---------- */
  .banner {
    height: 48px;
    background: #d9dadd;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: flex-end;
    -webkit-justify-content: flex-end;
    padding: 0 16px;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
    border-bottom: 1px solid #c5c6c9;
  }
  .banner-close {
    width: 24px;
    height: 24px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    color: #2a2a2a;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }

  /* ---------- 탭 바 (원형 아이콘 - design.md) ---------- */
  .tab-bar {
    height: 56px;
    background: #d9dadd;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    padding: 0;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
    gap: 0;
  }

  .tab-container {
    display: flex;
    -webkit-display: flex;
    gap: 0;
    align-items: center;
    -webkit-align-items: center;
    width: 100%;
    justify-content: space-around;
    -webkit-justify-content: space-around;
  }

  .tab {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    background: #c5c6c9;
    cursor: pointer;
    -webkit-transition: background 0.2s ease;
    transition: background 0.2s ease;
  }

  .tab:hover {
    background: #b5b6b9;
  }

  .tab.active {
    background: #5a5a5a;
  }

  /* ---------- 콘텐츠 패널 ---------- */
  .content-panel {
    flex: 1;
    -webkit-flex: 1;
    background: #ffffff;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 16px;
  }

  .content-item {
    display: none;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 16px;
  }

  .content-item.active {
    display: flex;
    -webkit-display: flex;
  }

  .content-placeholder {
    height: 80px;
    background: #f0f0f0;
    border-radius: 8px;
    -webkit-border-radius: 8px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    font-size: 13px;
    color: #888888;
  }

  /* ---------- 하단 네비게이션 (design.md) ---------- */
  .nav-bar {
    height: 48px;
    background: #ffffff;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: space-around;
    -webkit-justify-content: space-around;
    padding: 0;
    margin: 0;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
    border-top: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .nav-icon {
    font-size: 18px;
    line-height: 1;
    color: #4a4a4a;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .nav-icon.recent { 
    letter-spacing: -1px; 
    font-weight: 300;
    font-size: 14px;
  }

  .nav-icon.home {
    width: 16px;
    height: 16px;
    border: 1.5px solid #4a4a4a;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    -webkit-box-sizing: border-box;
  }

  .nav-icon.down { 
    font-size: 14px;
  }

  .nav-icon.apps {
    width: 18px;
    height: 18px;
    display: flex;
    -webkit-display: flex;
    flex-wrap: wrap;
    gap: 2px;
    align-content: flex-start;
    -webkit-box-sizing: border-box;
  }

  .nav-icon.apps span {
    width: calc(33.333% - 1.5px);
    height: calc(33.333% - 1.5px);
    background: #6a6a6a;
    -webkit-box-sizing: border-box;
  }

  /* ---------- 라벨 ---------- */
  .label {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #888;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="device">

  <!-- 상태바 -->
  <div class="status-bar">
    <div class="status-left">
      <span>SKT</span>
      <span>10:45</span>
    </div>
    <div class="status-right">
      <span class="signal">●●●</span>
      <div class="battery">
        <span>100</span>
        <div class="battery-icon">
          <div class="battery-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 입력 영역 -->
  <div class="input-area"></div>

  <!-- 배너 -->
  <div class="banner">
    <div class="banner-close">✕</div>
  </div>

  <!-- 탭 바 (원형 아이콘) -->
  <div class="tab-bar">
    <div class="tab-container">
      <div class="tab" data-tab="0"></div>
      <div class="tab active" data-tab="1"></div>
      <div class="tab" data-tab="2"></div>
      <div class="tab" data-tab="3"></div>
      <div class="tab" data-tab="4"></div>
      <div class="tab" data-tab="5"></div>
    </div>
  </div>

  <!-- 콘텐츠 패널 -->
  <div class="content-panel">
    <!-- 모든 탭: 추천 콘텐츠 5개 -->
    <div class="content-item active" data-content="0">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>

    <div class="content-item" data-content="1">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>

    <div class="content-item" data-content="2">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>

    <div class="content-item" data-content="3">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>

    <div class="content-item" data-content="4">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>

    <div class="content-item" data-content="5">
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
      <div class="content-placeholder">추천 콘텐츠</div>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <div class="nav-bar">
    <div class="nav-icon apps">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="nav-icon recent">|||</div>
    <div class="nav-icon home"></div>
    <div class="nav-icon down">⌄</div>
  </div>

</div>

<div class="label">CONTENT PANEL — 375 × 812 — 추천 콘텐츠 (6개 탭)</div>

<script>
  // 탭 전환 기능
  const tabs = document.querySelectorAll('.tab');
  const contentItems = document.querySelectorAll('.content-item');

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      const tabIndex = tab.getAttribute('data-tab');

      // 모든 탭과 콘텐츠 비활성화
      tabs.forEach(t => t.classList.remove('active'));
      contentItems.forEach(item => item.classList.remove('active'));

      // 선택된 탭과 콘텐츠 활성화
      tab.classList.add('active');
      const activeContent = document.querySelector(`.content-item[data-content="${tabIndex}"]`);
      if (activeContent) {
        activeContent.classList.add('active');
      }
    });
  });
</script>

</body>
</html>
