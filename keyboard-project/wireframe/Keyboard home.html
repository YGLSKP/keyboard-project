<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돈버는 키보드 - 홈</title>
<style>
  /* ---------- 리셋 ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #f4f4f4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ---------- 디바이스 프레임 ---------- */
  .device {
    width: 375px;
    height: 812px;
    background: #ffffff;
    border: 1px solid #d4d4d4;
    border-radius: 4px;
    -webkit-border-radius: 4px;
    overflow: hidden;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    position: relative;
  }

  /* ---------- 상태바 (design.md) ---------- */
  .status-bar {
    height: 28px;
    padding: 0 18px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: space-between;
    -webkit-justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
  }
  .status-left { 
    display: flex; 
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 6px; 
  }
  .status-right { 
    display: flex; 
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 4px; 
    font-size: 11px; 
  }
  .battery {
    display: inline-flex;
    -webkit-display: inline-flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 3px;
  }
  .battery-icon {
    width: 22px;
    height: 11px;
    border: 1px solid #1a1a1a;
    border-radius: 2px;
    position: relative;
    padding: 1px;
  }
  .battery-icon::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 3px;
    width: 2px;
    height: 3px;
    background: #1a1a1a;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    height: 100%;
    width: 100%;
    background: #1a1a1a;
    border-radius: 1px;
  }
  .signal { font-size: 10px; letter-spacing: -1px; }

  /* ---------- 콘텐츠 영역 (스크롤 가능) ---------- */
  .content-area {
    flex: 1;
    -webkit-flex: 1;
    background: #ffffff;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 16px;
  }

  /* ---------- 페이지 타이틀 ---------- */
  .page-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    padding: 8px 0;
    margin-bottom: 8px;
  }

  /* ---------- 오늘 적립 포인트 섹션 ---------- */
  .today-points-section {
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 12px;
  }

  .today-points-title {
    font-size: 13px;
    color: #888;
    font-weight: 400;
  }

  .today-points-value {
    font-size: 28px;
    font-weight: 600;
    color: #1a1a1a;
  }

  /* ---------- 프로그레스바 영역 ---------- */
  .progress-container {
    display: flex;
    -webkit-display: flex;
    gap: 8px;
    align-items: flex-end;
    -webkit-align-items: flex-end;
  }

  .progress-item {
    flex: 1;
    -webkit-flex: 1;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 6px;
    align-items: center;
    -webkit-align-items: center;
  }

  .progress-bar {
    width: 100%;
    height: 32px;
    background: #e8e8e8;
    border-radius: 4px;
    -webkit-border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #d9dadd;
    border-radius: 4px;
    -webkit-border-radius: 4px;
  }

  .progress-label {
    font-size: 11px;
    color: #666;
    font-weight: 500;
  }

  .progress-button {
    width: 100%;
    padding: 6px 8px;
    font-size: 11px;
    color: #666;
    background: #f0f0f0;
    border: 1px solid #d0d0d0;
    border-radius: 4px;
    -webkit-border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    -webkit-transition: background 0.2s ease;
    transition: background 0.2s ease;
  }

  .progress-button:active {
    background: #e0e0e0;
  }

  /* ---------- 누적포인트 영역 ---------- */
  .cumulative-points-section {
    background: #f8f8f8;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    -webkit-border-radius: 8px;
    padding: 16px;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 8px;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
  }

  .cumulative-label {
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }

  .cumulative-value {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
  }

  /* ---------- 썸네일 메뉴 ---------- */
  .thumbnail-menu {
    display: flex;
    -webkit-display: flex;
    gap: 16px;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
  }

  .menu-item {
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 8px;
    align-items: center;
    -webkit-align-items: center;
    cursor: pointer;
  }

  .menu-icon {
    width: 56px;
    height: 56px;
    background: #d9dadd;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    font-size: 24px;
    -webkit-transition: background 0.2s ease;
    transition: background 0.2s ease;
  }

  .menu-icon:active {
    background: #c5c6c9;
  }

  .menu-label {
    font-size: 12px;
    color: #3a3a3a;
    font-weight: 400;
    text-align: center;
    width: 56px;
  }

  /* ---------- 오늘의 미션 라벨 ---------- */
  .mission-label {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    padding: 8px 0;
    margin-top: 8px;
  }

  /* ---------- 타이핑 챌린지 섹션 ---------- */
  .challenge-section {
    background: #f8f8f8;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    -webkit-border-radius: 8px;
    padding: 20px 16px;
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 12px;
    align-items: center;
    -webkit-align-items: center;
    text-align: center;
  }

  .challenge-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .challenge-image {
    font-size: 48px;
    line-height: 1;
  }

  .challenge-button {
    width: 100%;
    padding: 10px 16px;
    background: #4a4a4a;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    -webkit-border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-transition: background 0.2s ease;
    transition: background 0.2s ease;
  }

  .challenge-button:active {
    background: #333;
  }

  /* ---------- 미션 박스 리스트 ---------- */
  .mission-list {
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 12px;
  }

  .mission-box {
    background: #f8f8f8;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    -webkit-border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    gap: 12px;
    cursor: pointer;
    -webkit-transition: background 0.2s ease;
    transition: background 0.2s ease;
  }

  .mission-box:active {
    background: #f0f0f0;
  }

  .mission-thumbnail {
    width: 56px;
    height: 56px;
    background: #e8e8e8;
    border-radius: 6px;
    -webkit-border-radius: 6px;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
  }

  .mission-content {
    display: flex;
    -webkit-display: flex;
    flex-direction: column;
    -webkit-flex-direction: column;
    gap: 4px;
    flex: 1;
    -webkit-flex: 1;
  }

  .mission-title {
    font-size: 14px;
    font-weight: 500;
    color: #1a1a1a;
  }

  .mission-description {
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }

  .mission-ad .mission-description {
    display: none;
  }

  /* ---------- 하단 네비게이션 (design.md) ---------- */
  .nav-bar {
    height: 48px;
    background: #ffffff;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: space-around;
    -webkit-justify-content: space-around;
    padding: 0;
    margin: 0;
    flex-shrink: 0;
    -webkit-flex-shrink: 0;
    border-top: 1px solid #f0f0f0;
    -webkit-user-select: none;
    user-select: none;
  }

  .nav-icon {
    font-size: 18px;
    line-height: 1;
    color: #4a4a4a;
    display: flex;
    -webkit-display: flex;
    align-items: center;
    -webkit-align-items: center;
    justify-content: center;
    -webkit-justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .nav-icon.recent { 
    letter-spacing: -1px; 
    font-weight: 300;
    font-size: 14px;
  }

  .nav-icon.home {
    width: 16px;
    height: 16px;
    border: 1.5px solid #4a4a4a;
    border-radius: 50%;
    -webkit-border-radius: 50%;
    -webkit-box-sizing: border-box;
  }

  .nav-icon.down { 
    font-size: 14px;
  }

  .nav-icon.apps {
    width: 18px;
    height: 18px;
    display: flex;
    -webkit-display: flex;
    flex-wrap: wrap;
    gap: 2px;
    align-content: flex-start;
    -webkit-box-sizing: border-box;
  }

  .nav-icon.apps span {
    width: calc(33.333% - 1.5px);
    height: calc(33.333% - 1.5px);
    background: #6a6a6a;
    -webkit-box-sizing: border-box;
  }

  /* ---------- 라벨 ---------- */
  .label {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #888;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="device">

  <!-- 상태바 -->
  <div class="status-bar">
    <div class="status-left">
      <span>SKT</span>
      <span>10:45</span>
    </div>
    <div class="status-right">
      <span class="signal">●●●●</span>
      <div class="battery">
        <span>100</span>
        <div class="battery-icon">
          <div class="battery-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 콘텐츠 영역 -->
  <div class="content-area">

    <!-- 오늘 적립 포인트 -->
    <div class="today-points-section">
      <div class="today-points-title">오늘 적립 포인트</div>
      <div class="today-points-value">312 P</div>
      <div class="progress-container">
        <div class="progress-item">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 60%;"></div>
          </div>
          <div class="progress-label">10타</div>
          <button class="progress-button">받기</button>
        </div>
        <div class="progress-item">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 30%;"></div>
          </div>
          <div class="progress-label">100타</div>
          <button class="progress-button">받기</button>
        </div>
        <div class="progress-item">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 15%;"></div>
          </div>
          <div class="progress-label">500타</div>
          <button class="progress-button">받기</button>
        </div>
        <div class="progress-item">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 0%;"></div>
          </div>
          <div class="progress-label">1,000타</div>
          <button class="progress-button">받기</button>
        </div>
      </div>
    </div>

    <!-- 누적포인트 영역 -->
    <div class="cumulative-points-section">
      <div class="cumulative-label">누적포인트</div>
      <div class="cumulative-value">6,970 P</div>
    </div>

    <!-- 네비게이션 메뉴 -->
    <div class="thumbnail-menu">
      <div class="menu-item">
        <div class="menu-icon">⚙️</div>
        <div class="menu-label">설정</div>
      </div>
      <div class="menu-item">
        <div class="menu-icon">🎨</div>
        <div class="menu-label">테마</div>
      </div>
      <div class="menu-item">
        <div class="menu-icon">💰</div>
        <div class="menu-label">마이포인트</div>
      </div>
    </div>

    <!-- 타이핑 챌린지 섹션 -->
    <div class="challenge-section">
      <div class="challenge-title">파티팟제의 숲단</div>
      <div class="challenge-image">🎂</div>
      <button class="challenge-button">게임 도전하기</button>
    </div>

    <!-- 미션 라벨 -->
    <div class="mission-label">오늘의 미션</div>

    <!-- 미션 리스트 -->
    <div class="mission-list">
      <div class="mission-box mission-type">
        <div class="mission-thumbnail">🎯</div>
        <div class="mission-content">
          <div class="mission-title">이벤트 타이틀</div>
          <div class="mission-description">디스크립션</div>
        </div>
      </div>

      <div class="mission-box mission-type">
        <div class="mission-thumbnail">📱</div>
        <div class="mission-content">
          <div class="mission-title">이벤트 타이틀</div>
          <div class="mission-description">디스크립션</div>
        </div>
      </div>

      <div class="mission-box mission-type">
        <div class="mission-thumbnail">🎁</div>
        <div class="mission-content">
          <div class="mission-title">이벤트 타이틀</div>
          <div class="mission-description">디스크립션</div>
        </div>
      </div>

      <div class="mission-box mission-ad">
        <div class="mission-thumbnail">📢</div>
        <div class="mission-content">
          <div class="mission-title">광고배너</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 하단 네비게이션 -->
  <div class="nav-bar">
    <div class="nav-icon apps">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="nav-icon recent">|||</div>
    <div class="nav-icon home"></div>
    <div class="nav-icon down">⌄</div>
  </div>

</div>

<div class="label">HOME — 375 × 812 — 돈버는 키보드 메인페이지</div>

</body>
</html>
